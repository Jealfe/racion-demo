name: Smoke tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check app-core.mjs
          node --check ui-polish.js
          node --check design-board.js
          node --check design-paste-images.js
          node --check ui-fixes.js
          node --check social-upgrades.js
          node --check home-layout.js
          node --check home-cards-redesign.js
          node --check interaction-fixes.js
          node --check settings-gear-final.js
          node --check push-recovery.js
          node --check food-options-expanded.js
          node --check couple-upgrades-v2.js
          node --check moment-stability-v2.js
          node --check love-popup.js
          node --check v2-social-bridge.js
          node --check sw.js
      - name: Run smoke tests
        run: node tests/smoke.mjs
      - name: Install browser test runner
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser interaction tests
        run: |
          python3 -m http.server 8000 >/tmp/racion-demo-http.log 2>&1 &
          npx playwright test tests/*.spec.mjs --reporter=line --workers=1 --grep-invert "социальная строка не сдвигает|хотелка остаётся после галочки|идея остаётся после галочки|нам нравится добавляется с автором|момент с картинкой добавляется с автором|облачная запись получает ленту"
